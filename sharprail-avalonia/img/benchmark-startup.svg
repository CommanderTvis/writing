<svg xmlns="http://www.w3.org/2000/svg" class="bench" viewBox="0 0 1200 786" width="1200" height="786" role="img" aria-label="Startup timeline per client"><style>
.bench{--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--line:#d9d9de;--wait:#c8c8cf;--host:#4f7cff;--window:#f59e42;--content:#2fb5a5;--layout:#3fae5a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){.bench{--bg:#161618;--fg:#ececee;--muted:#9a9aa1;--line:#333338;--wait:#6e6e78;--host:#5f8cff;--window:#d98428;--content:#25968a;--layout:#33954b}}
.bench .bg{fill:var(--bg)}.bench text{fill:var(--fg);font-size:12px}.bench .muted{fill:var(--muted)}.bench .small{font-size:11px}.bench .name{font-size:13px;font-weight:600}.bench .title{font-size:15px;font-weight:600}.bench .bold{font-weight:600}.bench .on{fill:#fff}
.bench .grid{stroke:var(--line);stroke-dasharray:3 3}.bench .rule{stroke:var(--line)}.bench .err{stroke:var(--fg);stroke-width:1.5;fill:none}
.bench .window{fill:var(--window)}.bench .content{fill:var(--content)}.bench .layout{fill:var(--layout)}.bench .host{fill:var(--host)}.bench .serving{fill:var(--host);fill-opacity:.2}.bench .wait{fill:url(#hatch)}.bench .hatch{stroke:var(--wait);stroke-width:5}.bench .gate{fill:none;stroke:var(--host);stroke-width:2;stroke-dasharray:5 4}
</style><rect class="bg" width="1200" height="786"/><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="10"/></pattern></defs>
